        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff7ef;
            color: #222;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            min-height: 100vh;
        }

        /* =========================
           AUTH PAGE
        ========================= */

        .auth-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .auth-left {
            background: linear-gradient(135deg, #f97316, #fb923c);
            color: white;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-icon {
            font-size: 70px;
            margin-bottom: 10px;
        }

        .auth-left h1 {
            font-size: 58px;
            margin: 0;
        }

        .auth-left p {
            font-size: 20px;
            line-height: 1.6;
            max-width: 520px;
        }

        .features {
            margin-top: 25px;
            display: grid;
            gap: 14px;
            font-weight: bold;
        }

        .auth-right {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-y: auto;
        }

        .auth-card {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }

        .auth-card h2 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .field input,
        .field select {
            width: 100%;
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 0 13px;
            outline: none;
        }

        .field input:focus,
        .field select:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px #fff0e5;
        }

        .primary-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 11px;
            background: #f97316;
            color: white;
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
        }

        .primary-button:hover {
            background: #ea580c;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        .switch button {
            border: none;
            background: none;
            color: #f97316;
            font-weight: bold;
        }

        .error {
            background: #fff0f0;
            color: #dc2626;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success {
            background: #effdf4;
            color: #15803d;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        /* =========================
           DASHBOARD
        ========================= */

        .dashboard {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #eee;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 25px;
        }

        .brand span {
            color: #f97316;
        }

        .user-box {
            background: #fff4eb;
            padding: 13px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .user-box strong {
            display: block;
        }

        .user-box small {
            color: #f97316;
            font-weight: bold;
        }

        .nav {
            display: grid;
            gap: 5px;
        }

        .nav button {
            border: none;
            background: transparent;
            text-align: left;
            padding: 13px;
            border-radius: 10px;
            color: #666;
            font-weight: bold;
        }

        .nav button:hover,
        .nav .active {
            background: #fff0e5;
            color: #ea580c;
        }

        .logout {
            margin-top: auto;
            border: none;
            background: #fff0f0;
            color: #dc2626;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .content {
            flex: 1;
            padding: 45px;
            overflow-y: auto;
        }

        .content h1 {
            margin: 0;
            font-size: 35px;
        }

        .muted {
            color: #888;
        }

        /* =========================
           CARDS
        ========================= */

        .stats {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat {
            background: white;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 17px;
        }

        .stat-icon {
            font-size: 25px;
        }

        .stat strong {
            display: block;
            font-size: 28px;
            margin-top: 10px;
        }

        .progress {
            height: 7px;
            background: #eee;
            border-radius: 10px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress div {
            height: 100%;
            background: #f97316;
        }

        .section {
            margin-top: 40px;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 20px;
        }

        .food {
            background: white;
            border: 1px solid #eee;
            padding: 18px;
            border-radius: 17px;
        }

        .food-top {
            display: flex;
            justify-content: space-between;
        }

        .food h3 {
            margin: 0;
        }

        .nutrition {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            color: #777;
            font-size: 12px;
            margin: 15px 0;
        }

        .add {
            background: #f97316;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
        }

        .add:disabled {
            background: #ccc;
        }

        .search {
            margin-top: 25px;
            width: 100%;
            max-width: 400px;
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 0 15px;

            padding: 30px;
            border-radius: 20px;

            .content {

            border-radius: 20px;

            color: #ea580c;

            margin-top: 25px;

            color: white;

        }

            background: #181818;
            color: white;
            border-left: 5px solid #f97316;
            border-radius: 0 15px 15px 0;
            padding: 20px;
            margin-top: 10px;
        }

        .meal-card:first-of-type {
            border-radius: 0 0 15px 15px;
        }

        .meal-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .meal-card h3 {
            color: #f97316;
            margin: 0;
            font-size: 21px;
        }

        .meal-time {
            color: #f59e0b;
            font-weight: bold;
            white-space: nowrap;
        }

        .meal-items {
            margin: 14px 0 0;
            color: #eee;
            line-height: 1.65;
            font-size: 15px;
        }

        .menu-item {
            display: inline-block;
            background: #242424;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 5px 9px;
            margin: 4px 4px 0 0;
        }

        .mess-note {
            margin-top: 15px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .day-picker {
                grid-template-columns: repeat(4, 1fr);
            }

            .meal-card-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .meal-time {
                font-size: 13px;
            }
        }

        .selectable-menu-item {
            cursor: pointer;
            user-select: none;
            transition: 0.15s ease;
        }

        .selectable-menu-item:hover {
            border-color: #f97316;
            transform: translateY(-1px);
        }

        .selectable-menu-item.selected {
            background: #fff0e5;
            border-color: #f97316;
            color: #ea580c;
            font-weight: bold;
        }

        .selection-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 18px;
            padding: 15px;
            background: #fff7ef;
            border-radius: 12px;
        }

        .selection-bar button {
            border: none;
            background: #f97316;
            color: white;
            padding: 10px 16px;
            border-radius: 9px;
            font-weight: bold;
        }

        .selection-bar button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .menu-food-card {
            background: white;
            border: 1px solid #eee;
            padding: 18px;
            border-radius: 17px;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .menu-food-card:hover {
            border-color: #f97316;
            transform: translateY(-2px);
        }

        .menu-food-card.selected {
            border: 2px solid #f97316;
            background: #fff7ef;
        }

        .menu-food-card h3 {
            margin: 0 0 10px;
        }

        .meal-label {
            color: #f97316;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .select-hint {
            color: #888;
            font-size: 13px;
            margin-top: 10px;
        }

        .tracker-log-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .unlog-button {
            border: 1px solid #e5e5e5;
            background: #fff;
            color: #b42318;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .unlog-button:hover {
            background: #fff1f0;
            border-color: #f0b7b2;
        }
    </style>
</head>

/* Approximate nutrition per listed mess serving. Values are estimates. */
function getMessNutrition(item) {
    const n = item.toLowerCase();

    if (n.includes("chicken biryani")) return { calories: 520, protein: 28, carbs: 62, fat: 18 };
    if (n.includes("chicken curry")) return { calories: 260, protein: 25, carbs: 8, fat: 14 };
    if (n.includes("chicken sukka")) return { calories: 300, protein: 27, carbs: 7, fat: 18 };
    if (n.includes("chicken 65")) return { calories: 280, protein: 22, carbs: 14, fat: 17 };
    if (n.includes("chicken kabab") || n.includes("chilli chicken")) return { calories: 260, protein: 24, carbs: 12, fat: 13 };

    if (n.includes("ice cream")) return { calories: 150, protein: 3, carbs: 18, fat: 7 };
    if (n.includes("gulab jamun")) return { calories: 150, protein: 2, carbs: 25, fat: 5 };
    if (n.includes("sewai kheer") || n.includes("rice payasam")) return { calories: 180, protein: 4, carbs: 28, fat: 6 };
    if (n.includes("fruit custard")) return { calories: 160, protein: 4, carbs: 25, fat: 5 };
    if (n.includes("fruit salad")) return { calories: 100, protein: 1, carbs: 24, fat: 0 };

    if (n.includes("dosa")) return { calories: 170, protein: 4, carbs: 28, fat: 5 };
    if (n.includes("idli")) return { calories: 65, protein: 2, carbs: 13, fat: 0.5 };
    if (n.includes("vada")) return { calories: 120, protein: 3, carbs: 15, fat: 6 };
    if (n.includes("masala dosa")) return { calories: 280, protein: 6, carbs: 42, fat: 9 };
    if (n.includes("set dosa")) return { calories: 220, protein: 5, carbs: 36, fat: 6 };
    if (n.includes("poori")) return { calories: 105, protein: 2, carbs: 14, fat: 5 };
    if (n.includes("methi poori")) return { calories: 115, protein: 2, carbs: 15, fat: 5 };

/* ==========================================
   APP
========================================== */

function App() {
    const [page, setPage] = useState("login");

    const [user, setUser] = useState(
        JSON.parse(localStorage.getItem("campusBiteUser"))
    );

    const [meals, setMeals] = useState(
        JSON.parse(localStorage.getItem("campusBiteMeals")) || []
    );

    useEffect(() => {
        if (user) {
            localStorage.setItem("campusBiteUser", JSON.stringify(user));
        }
    }, [user]);

    useEffect(() => {
        localStorage.setItem("campusBiteMeals", JSON.stringify(meals));
    }, [meals]);

    function login(username, password) {
        const savedUser = JSON.parse(localStorage.getItem("campusBiteAccount"));

        if (!savedUser) {
            return "No account exists. Please register first.";
        }

        if (
            savedUser.username !== username ||
            savedUser.password !== password
        ) {
            return "Incorrect username or password.";
        }

        setUser(savedUser);
        setPage("dashboard");
        return null;
    }

    function register(account) {
        localStorage.setItem("campusBiteAccount", JSON.stringify(account));
        setUser(account);
        setPage("dashboard");
    }

    function logout() {
        setUser(null);
        setPage("login");
    }

    function addMeal(food) {
        setMeals([
            ...meals,
            {
                ...food,
                logId: `${food.id || "food"}-${Date.now()}-${Math.random().toString(36).slice(2)}`,
                time: new Date().toLocaleTimeString()
            }
        ]);
    }

    function removeMeal(logId) {
        setMeals(current => current.filter(meal => meal.logId !== logId));
    }

    if (!user) {
        if (page === "register") {
            return (
                <Register
                    register={register}
                    goLogin={() => setPage("login")}
                />
            );
        }

        return (
            <Login
                login={login}
                goRegister={() => setPage("register")}
            />
        );
    }

    return (
        <Dashboard
            user={user}
            logout={logout}
            meals={meals}
            addMeal={addMeal}
            removeMeal={removeMeal}
        />
    );
}

function Dashboard({ user, logout, meals, addMeal, removeMeal }) {
    const [section, setSection] = useState("home");
    const [geminiResponse, setGeminiResponse] = useState("");
    const [loadingAi, setLoadingAi] = useState(false);
    const [nightCanteenMenu, setNightCanteenMenu] = useState([]);

    useEffect(() => {
        async function fetchNightCanteenMenu() {
            try {
                const response = await fetch("http://localhost:5000/api/night-canteen-menu");
                const data = await response.json();
                setNightCanteenMenu(data);
            } catch (error) {
                console.error("Could not fetch canteen menu:", error);
            }
        }
        fetchNightCanteenMenu();
    }, []);

    const totalCalories = meals.reduce((sum, food) => sum + Number(food.calories), 0);
    const totalProtein = meals.reduce((sum, food) => sum + Number(food.protein), 0);

    const todayName = messDayOrder[new Date().getDay()];

    const recommendations = Object.keys(mealLabels).flatMap(mealKey =>
        messMenu[todayName][mealKey].map((item, index) => ({
            id: `recommend-${todayName}-${mealKey}-${index}`,
            name: item,
            ...getMessNutrition(item),
            vegetarian: true,
            messItem: true,
            meal: mealKey,
            nutritionAvailable: false
        }))
    );

    async function askGemini() {
        setLoadingAi(true);
        setGeminiResponse("");

        const remCalories = Number(user.calories) - totalCalories;
        const remProtein = Number(user.protein) - totalProtein;

        const requestText =
            `I have about ${remCalories} calories and ${remProtein}g of protein left for today. ` +
            `My goal is ${user.goal}, and my dietary preference is ${user.diet || "no preference"}. ` +
            `Recommend items from the Night Canteen menu that fit.`;

        try {
            const response = await fetch("http://localhost:5000/api/recommend", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    request: requestText
                })
            });

            const data = await response.json();

            if (!response.ok) {
                setGeminiResponse(`Error: ${data.error || "Failed to fetch AI response"}`);
            } else {
                setGeminiResponse(data.recommendation);
            }
        } catch (error) {
            console.error("Gemini API Request Failed:", error);
            setGeminiResponse("Failed to connect to the backend server.");
        } finally {
            setLoadingAi(false);
        }
    }

                    🍊 Campus <span>Bite</span>

                        🍱 Food Menu
                    </button>

                    <button
                        className={section === "mess" ? "active" : ""}

                    >
                        🍽️ Mess Menu
                    </button>

                    <button
                        className={section === "recommend" ? "active" : ""}
                        onClick={() => setSection("recommend")}
                    >
                        ⚡ Recommendations
                    </button>

                    <button
                        className={section === "tracker" ? "active" : ""}

function getWeekDate(dayName) {
    const today = new Date();
    const currentDay = today.getDay();
    const targetDay = messDayOrder.indexOf(dayName);
    const date = new Date(today);

    date.setDate(today.getDate() + (targetDay - currentDay));
    return date;
}

function formatMessDate(date) {
    return `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;
}

function MessMenu({ addMeal }) {
    const todayName = messDayOrder[new Date().getDay()];
    const [selectedDay, setSelectedDay] = useState(todayName);
    const [selectedItems, setSelectedItems] = useState([]);

    const menu = messMenu[selectedDay];
    const selectedDate = getWeekDate(selectedDay);

    function toggleItem(item, meal) {
        const key = `${meal}-${item}`;
        setSelectedItems(current =>
            current.includes(key)
                ? current.filter(x => x !== key)
                : [...current, key]
        );
    }

    function selectItemsForTracker() {
        selectedItems.forEach(key => {
            const separator = key.indexOf("-");
            const meal = key.slice(0, separator);
            const item = key.slice(separator + 1);

            addMeal({
                id: `mess-${selectedDay}-${meal}-${item}-${Date.now()}`,
                name: item,
                ...getMessNutrition(item),
                vegetarian: true,
                messItem: true,
                meal: meal,
                nutritionAvailable: true
            });
        });

        setSelectedItems([]);
    }

    function changeDay(day) {
        setSelectedDay(day);
        setSelectedItems([]);
    }

    return (
        <>
            <h1>Mess Menu 🍽️</h1>
            <p className="muted">Select a day, then select the mess food you want.</p>

            <div className="mess-header-card">
                <h2>Weekly Hostel Mess Menu</h2>
                <p className="muted">Select individual food items from any meal.</p>

                <div className="day-picker">
                    {messDayOrder.map(day => (
                        <button
                            key={day}
                            className={
                                "day-button " +
                                (selectedDay === day ? "active " : "") +
                                (todayName === day ? "today" : "")
                            }
                            onClick={() => changeDay(day)}
                        >
                            {day.slice(0, 3)}
                        </button>
                    ))}
                </div>
            </div>

            <div className="mess-menu">
                <div className="mess-date">
                    <h2>{selectedDay}</h2>
                    <p>{formatMessDate(selectedDate)}</p>
                </div>

                {Object.keys(mealLabels).map(mealKey => (
                    <div className="meal-card" key={mealKey}>
                        <div className="meal-card-top">
                            <h3>{mealLabels[mealKey].title}</h3>
                            <span className="meal-time">{mealLabels[mealKey].time}</span>
                        </div>

                        <div className="meal-items">
                            {menu[mealKey].map((item, index) => {
                                const key = `${mealKey}-${item}`;

                                return (
                                    <span
                                        className={
                                            "menu-item selectable-menu-item " +
                                            (selectedItems.includes(key) ? "selected" : "")
                                        }
                                        key={index}
                                        onClick={() => toggleItem(item, mealKey)}
                                    >
                                        {selectedItems.includes(key) ? "✓ " : ""}
                                        {item}
                                    </span>
                                );
                            })}
                        </div>
                    </div>
                ))}

                <div className="selection-bar">
                    <span>
                        <strong>{selectedItems.length}</strong> item(s) selected
                    </span>

                    <button
                        onClick={selectItemsForTracker}
                        disabled={selectedItems.length === 0}
                    >
                        Add Selected to Tracker
                    </button>
                </div>
            </div>
        </>
    );
}

/* ==========================================
   MESS FOOD MENU
========================================== */

function MessFoodMenu({ addMeal }) {
    const todayName = messDayOrder[new Date().getDay()];
    const menu = messMenu[todayName];
    const [selected, setSelected] = useState([]);

    const allItems = Object.keys(mealLabels).flatMap(mealKey =>
        menu[mealKey].map((item, index) => ({
            id: `${mealKey}-${index}-${item}`,
            name: item,
            meal: mealKey
        }))
    );

    function selectFood(item) {
        if (selected.includes(item.id)) return;

        addMeal({
            id: `mess-food-${item.id}-${Date.now()}`,
            ...getMessNutrition(item.name),
            vegetarian: true,
            messItem: true,
            meal: item.meal,
            nutritionAvailable: true
        });

        setSelected(current => [...current, item.id]);
    }

    return (
        <>
            <h1>Food Menu 🍱</h1>
            <p className="muted">
                Today's hostel mess food — {todayName}. Click a food item to add it to your tracker.
            </p>

            <div className="food-grid">
                {allItems.map(item => (
                    <div
                        key={item.id}
                        className={
                            "menu-food-card " +
                            (selected.includes(item.id) ? "selected" : "")
                        }
                        onClick={() => selectFood(item)}
                    >
                        <div className="meal-label">{mealLabels[item.meal].title}</div>
                        <h3>
                            {selected.includes(item.id) ? "✓ " : ""}
                            {item.name}
                        </h3>
                        <div className="select-hint">
                            {selected.includes(item.id)
                                ? "Added to tracker"
                                : "Click to add to tracker"}
                        </div>
                    </div>
                ))}
            </div>
        </>
    );
}

/* ==========================================
   STAT
========================================== */

function Stat({ icon, title, value, target }) {
    let percent = 0;

    if (target && !isNaN(Number(value))) {
        percent = Math.min((Number(value) / Number(target)) * 100, 100);
    }

    return (
        <div className="stat">
            <div className="stat-icon">{icon}</div>
            <div className="muted">{title}</div>
            <strong>{value}</strong>

            {target && (
                <>
                    <div className="progress">
                        <div style={{ width: percent + "%" }} />
                    </div>
                    <small className="muted">Target: {target}</small>
                </>
            )}
        </div>
    );
}

/* ==========================================
   FOOD CARD
========================================== */

function FoodCard({ food, addMeal }) {
    return (
        <div className="food">
            <div className="food-top">
                <div>
                    <h3>
                        {food.vegetarian ? "🥗" : "🍗"} {food.name}
                    </h3>
                </div>
            </div>

            <div className="nutrition">
                <span>🔥 {food.calories} kcal</span>
                <span>💪 {food.protein}g</span>
                <span>🍚 {food.carbs}g</span>
                <span>🥑 {food.fat}g</span>
            </div>

            <button className="add" onClick={() => addMeal(food)}>
                + Add to Tracker
            </button>
        </div>
    );
}

/* ==========================================
   START REACT
========================================== */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
